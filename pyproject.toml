[project]
name = "wolaita-rl"
version = "1.0.0"
description = "RL summative: DQN, REINFORCE, A2C and PPO (TorchRL) on a Wolaita ASR corpus-campaign environment"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "gymnasium>=1.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "tensordict>=0.15",
    "torch>=2.4",
    "torchrl>=0.15",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore"]
